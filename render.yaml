services:
  - type: web
    name: partner-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npm run db:setup && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
